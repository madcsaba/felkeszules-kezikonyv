<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felkészülés app</title>
<meta name="theme-color" content="#1f5f5b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Layout: one phone-width column, fixed header and bottom tab bar, one job per screen. */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --ink:#132120; --muted:#52625e; --line:#d3dcd9;
  --accent:#1f5f5b; --on-accent:#ffffff;
  --danger:#b3261e; --danger-bg:#fdecea;
  --warn:#7a5200; --warn-bg:#fff2d1;
  --ok:#1e6b3f; --ok-bg:#e3f4ea;
  --lane-advice:#2e7d4f; --lane-local:#1f5fa8; --lane-alert:#c2571a;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1615; --surface:#18221f; --ink:#eef4f2; --muted:#a4b3af; --line:#2d3b38;
    --accent:#74cbc1; --on-accent:#06201d;
    --danger:#ffb4a9; --danger-bg:#4a1410;
    --warn:#ffd27a; --warn-bg:#3d2c00;
    --ok:#8fdcae; --ok-bg:#12331f;
    --lane-advice:#7fd3a0; --lane-local:#8fbdf2; --lane-alert:#f2a877;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1615; --surface:#18221f; --ink:#eef4f2; --muted:#a4b3af; --line:#2d3b38;
  --accent:#74cbc1; --on-accent:#06201d;
  --danger:#ffb4a9; --danger-bg:#4a1410;
  --warn:#ffd27a; --warn-bg:#3d2c00;
  --ok:#8fdcae; --ok-bg:#12331f;
  --lane-advice:#7fd3a0; --lane-local:#8fbdf2; --lane-alert:#f2a877;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.45;display:flex;justify-content:center}
.app{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;background:var(--bg)}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.mark{background:var(--accent);color:var(--on-accent);font-weight:700;border-radius:10px;padding:6px 9px;font-size:16px;letter-spacing:.02em}
header h1{font-size:20px;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
select,input,textarea,button{font:inherit;color:inherit}
select,input,textarea{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-height:56px;width:100%}
header select{width:auto;min-height:48px;padding:8px 10px;font-weight:600}
textarea{min-height:96px;resize:vertical}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
h2{font-size:26px;line-height:1.2;margin:0;text-wrap:balance}
h3{font-size:20px;margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted);font-size:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.big{display:flex;align-items:center;gap:16px;width:100%;min-height:76px;padding:14px 16px;background:var(--surface);border:2px solid var(--line);border-radius:16px;font-size:22px;font-weight:650;text-align:left;cursor:pointer}
.big svg{flex:none;width:36px;height:36px;color:var(--accent)}
.big .chev{margin-left:auto;width:24px;height:24px;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:12px 16px;border-radius:14px;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:650;cursor:pointer;text-decoration:none;text-align:center}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.plain{border-color:var(--line);background:var(--surface);color:var(--ink);justify-content:flex-start;text-align:left;font-weight:600}
.call{background:var(--danger);border-color:var(--danger);color:var(--surface);font-size:20px}
.banner{background:var(--danger-bg);border:2px solid var(--danger);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.banner strong{color:var(--danger);font-size:16px;text-transform:uppercase;letter-spacing:.04em}
.banner .msg{font-size:22px;font-weight:650;line-height:1.3}
.calm{background:var(--ok-bg);color:var(--ok);border-radius:14px;padding:12px 16px;font-weight:600;font-size:16px}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
ol.steps li{counter-increment:s;display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;font-size:20px;line-height:1.35}
ol.steps li::before{content:counter(s);flex:none;width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:700;display:flex;align-items:center;justify-content:center}
.check{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-of-type{border-top:0}
.check input{flex:none;width:30px;height:30px;min-height:0;padding:0;margin:0;accent-color:var(--accent)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button,.seg button{min-width:56px;min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:24px;font-weight:700;cursor:pointer}
.stepper output{min-width:40px;text-align:center;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:8px}
.seg button{font-size:20px;padding:0 18px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.result{font-size:26px;font-weight:700;line-height:1.2}
.num{display:flex;align-items:center;gap:16px;padding:12px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.num:first-of-type{border-top:0}
.num b{font-size:30px;min-width:76px;color:var(--danger);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.05em;border-radius:8px;padding:3px 8px;background:var(--warn-bg);color:var(--warn)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.no{background:var(--danger-bg);color:var(--danger)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:12px 16px;font-size:16px}
.rec{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.rec:first-of-type{border-top:0}
.lane{border-left:6px solid var(--line);border-radius:0;padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:2px}
.lane.advice{border-color:var(--lane-advice)} .lane.local{border-color:var(--lane-local)} .lane.alert{border-color:var(--lane-alert)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;overflow-wrap:anywhere;display:block}
nav{display:flex;background:var(--surface);border-top:1px solid var(--line)}
nav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 10px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;overflow-wrap:anywhere;text-align:center;border-top:3px solid transparent}
nav a svg{width:26px;height:26px}
nav a[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:360px){body{font-size:17px}.big{font-size:20px}nav a{font-size:11px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="mark" aria-hidden="true">72h</span>
    <h1 id="title"></h1>

    <select id="lang"></select>
  </header>
  <main id="main" tabindex="-1"></main>
  <nav id="nav" aria-label="Menu"></nav>
</div>

function checkScope(issuerId, type, region) {
  var iss = ISSUERS[issuerId];
  if (!iss) return "r_unknown";
  var typeOk = iss.types.indexOf(type) !== -1;
  var regionOk = iss.regions.some(function (r) { return region === r || region.indexOf(r + "-") === 0; });
  return typeOk && regionOk ? null : "r_scope";
}

    '</select></label><p class="muted">' + t("regionNote") + "</p></section>" +
    '<section class="card"><h3>' + t("emergencyNumbers") + "</h3><div>" +
    ["112", "104", "105", "107"].map(function (n) { return '<a class="num" href="tel:' + n + '"><b>' + n + "</b><span>" + t("n" + n) + "</span></a>"; }).join("") +
    "</div></section>" +
    '<section class="card"><div class="row between"><h3>' + t("localData") + " · " + esc(reg.name) + '</h3><span class="tag">' + t("sample") + "</span></div>" +
    '<p class="note">' + t("localNote") + "</p><div>" +
    reg.records.map(function (r) {
      return '<div class="rec"><div><strong>' + t("type_" + r.type) + '</strong><br><span class="muted">' + t("samplePlace", { n: r.n }) + '</span></div><span class="tag">' + t("sample") + "</span></div>";
    }).join("") + "</div></section>";
}

var PLAN_FIELDS = [["meet1", "text"], ["meet2", "text"], ["cname", "text"], ["cphone", "tel"], ["kids", "text"], ["meds", "area"], ["shut", "area"]];
function planText() {
  return t("planTitle") + "\n" + PLAN_FIELDS.map(function (f) { return t("f_" + f[0]) + ": " + (state.plan[f[0]] || "–"); }).join("\n");
}
function viewTervem() {
  var html = "<h2>" + t("planTitle") + '</h2><p class="muted">' + t("planNote") + '</p><div class="stack">' +
    PLAN_FIELDS.map(function (f) {
      var id = "plan-" + f[0], v = esc(state.plan[f[0]] || "");
      var ctl = f[1] === "area"
        ? '<textarea id="' + id + '" data-plan="' + f[0] + '">' + v + "</textarea>"
        : '<input id="' + id + '" type="' + f[1] + '" data-plan="' + f[0] + '" value="' + v + '" autocomplete="off">';
      return '<label class="f" for="' + id + '">' + t("f_" + f[0]) + ctl + "</label>";
    }).join("") + "</div>" +
    '<button class="btn" data-act="copy">' + t("copy") + "</button>" +
    '<p class="muted" id="copy-status" role="status"></p>';
  if (state.copyText !== null) html += '<textarea id="copy-out" readonly>' + esc(state.copyText) + "</textarea>";
  return html;
}

function viewFrissitesek() {
  var alertCount = state.msgs.filter(function (m) { return m.ok; }).length;
  var html = '<section class="card"><h3>' + t("packs") + "</h3>" +
    '<div class="lane advice"><strong>' + t("lane_advice") + '</strong><span class="muted">' + t("publisher") + ": " + esc(L(ISSUERS.osz.name)) + '</span><span class="muted">' + t("scopeNational") + " · " + t("version") + " " + ADVICE.version + "</span></div>" +
    '<div class="lane local"><strong>' + t("lane_local") + " · " + esc(LOCAL[state.region].name) + ' <span class="tag">' + t("sample") + '</span></strong><span class="muted">' + t("publisher") + ": " + t("noSteward") + '</span><span class="muted">' + t("scopeRegion") + "</span></div>" +
    '<div class="lane alert"><strong>' + t("lane_alert") + " (" + alertCount + ')</strong><span class="muted">' + t("publisher") + ": " + esc(L(ISSUERS.ugy.name)) + '</span><span class="muted">' + t("scopeNational") + "</span></div></section>" +
    '<section class="card"><h3>' + t("tryTitle") + '</h3><p class="muted">' + t("tryNote") + "</p>" +
    '<button class="btn plain" data-act="demo" data-n="1">' + t("demo1") + "</button>" +
    '<button class="btn plain" data-act="demo" data-n="2">' + t("demo2") + "</button>" +
    '<button class="btn plain" data-act="demo" data-n="3">' + t("demo3") + "</button>" +
    '<p class="note">' + t("protoNote") + "</p></section>";
  if (state.msgs.length) {
    html += '<section class="card">' + state.msgs.slice().reverse().map(function (m) {
      var who = ISSUERS[m.issuer] ? L(ISSUERS[m.issuer].name) : m.issuer;
      return '<div class="stack"><div class="row between"><strong>' + esc(who) + '</strong><span class="tag ' + (m.ok ? "ok" : "no") + '">' + t(m.ok ? "accepted" : "rejected") + "</span></div>" +
        "<code>" + esc(m.raw) + '</code><span class="muted">' + t("bytes", { n: m.bytes }) + " · " + t(m.ok ? "r_ok" : m.reason) + "</span></div>";
    }).join('<hr style="width:100%;border:0;border-top:1px solid var(--line);margin:0">') +
      '<button class="btn ghost" data-act="clear">' + t("clear") + "</button></section>";
  }
  return html;
}

var VIEWS = { most: viewMost, felkeszules: viewFelkeszules, helyben: viewHelyben, tervem: viewTervem, frissitesek: viewFrissitesek };

function render(keepScroll) {
  var scr = current(), main = document.getElementById("main"), y = main.scrollTop;
  document.documentElement.lang = state.lang;
  document.title = t("title");
  document.getElementById("title").textContent = t("title");
  document.getElementById("lang-label").textContent = t("language");
  main.innerHTML = VIEWS[scr]();
  main.scrollTop = keepScroll ? y : 0;
  document.getElementById("nav").innerHTML = SCREENS.map(function (s) {
    return '<a href="#' + s + '"' + (s === scr ? ' aria-current="page"' : "") + ">" + icon(s) + "<span>" + t("nav_" + s) + "</span></a>";
  }).join("");
}

/* ---------- Compact message: version|template|region|expiry|issuer ---------- */
function receive(issuer, region) {
  var until = Date.now() + 48 * 3600 * 1000;
  var raw = ["1", "T01", region, Math.floor(until / 60000).toString(36), issuer].join("|");
  var reason = checkScope(issuer, "alert", region);
  var bytes = raw.length;
  try { bytes = new TextEncoder().encode(raw).length; } catch (e) {}
  state.msgs = state.msgs.filter(function (m) { return !(m.tpl === "T01" && m.region === region && m.issuer === issuer); });
  state.msgs.push({ raw: raw, bytes: bytes, tpl: "T01", region: region, until: until, issuer: issuer, ok: !reason, reason: reason });
  if (state.msgs.length > 8) state.msgs = state.msgs.slice(-8);
  store.set("msgs", state.msgs);
}

/* ---------- Events ---------- */
document.addEventListener("click", function (ev) {
  var el = ev.target.closest("[data-act]"); if (!el || el.tagName === "INPUT") return;
  var act = el.getAttribute("data-act");
  if (act === "card") { state.card = el.getAttribute("data-id"); render(); }
  else if (act === "back") { state.card = null; render(); }
  else if (act === "persons") { state.persons = Math.min(12, Math.max(1, state.persons + Number(el.getAttribute("data-d")))); store.set("persons", state.persons); render(true); }
  else if (act === "days") { state.days = Number(el.getAttribute("data-d")); store.set("days", state.days); render(true); }
  else if (act === "demo") {
    var n = el.getAttribute("data-n");
    if (n === "1") receive("ugy", state.region);
    else if (n === "2") receive("aghb", state.region === "HU-BU" ? "HU-GS" : "HU-BU");
    else receive("x9k2", state.region);
    render(true);
  }
  else if (act === "clear") { state.msgs = []; store.set("msgs", []); render(true); }
  else if (act === "copy") {
    var text = planText();
    var status = document.getElementById("copy-status");
    var fail = function () { state.copyText = text; render(true); document.getElementById("copy-status").textContent = t("copyFail"); };
    try {
      navigator.clipboard.writeText(text).then(function () { status.textContent = t("copied"); }, fail);
    } catch (e) { fail(); }
  }
});
document.addEventListener("change", function (ev) {
  var el = ev.target;
  if (el.id === "lang") { state.lang = el.value; store.set("lang", state.lang); render(true); }
  else if (el.id === "region") { state.region = el.value; store.set("region", state.region); render(true); }
  else if (el.getAttribute("data-act") === "check") {
    var id = el.getAttribute("data-id");
    if (el.checked) state.checks[id] = 1; else delete state.checks[id];
    store.set("checks", state.checks); render(true);
  }
});
document.addEventListener("input", function (ev) {
  var k = ev.target.getAttribute && ev.target.getAttribute("data-plan");
  if (k) { state.plan[k] = ev.target.value; store.set("plan", state.plan); }
});
window.addEventListener("hashchange", function () { state.card = null; state.copyText = null; render(); });

var langSel = document.getElementById("lang");
langSel.innerHTML = Object.keys(LANGS).map(function (k) { return '<option value="' + k + '">' + LANGS[k] + "</option>"; }).join("");
langSel.value = state.lang;
render();
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(function () {}); }
</script>
</body>
</html>
