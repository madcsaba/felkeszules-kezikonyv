<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felkészülés app</title>
<meta name="theme-color" content="#1f5f5b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="../assets/fonts.css">
<style>
/* Layout: one phone-width column, fixed header and bottom tab bar, one job per screen. */
:root{
  --bg:#f7f5f0; --surface:#ffffff; --ink:#1f2a2e; --muted:#52625e; --line:#dcded8;
  --accent:#1f5f5b; --on-accent:#ffffff;
  --danger:#b3261e; --danger-bg:#fdecea;
  --warn:#7a5200; --warn-bg:#fff2d1;
  --ok:#1e6b3f; --ok-bg:#e3f4ea;
  --lane-advice:#2e7d4f; --lane-local:#1f5fa8; --lane-alert:#c2571a;
  --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1615; --surface:#18221f; --ink:#eef4f2; --muted:#a4b3af; --line:#2d3b38;
    --accent:#74cbc1; --on-accent:#06201d;
    --danger:#ffb4a9; --danger-bg:#4a1410;
    --warn:#ffd27a; --warn-bg:#3d2c00;
    --ok:#8fdcae; --ok-bg:#12331f;
    --lane-advice:#7fd3a0; --lane-local:#8fbdf2; --lane-alert:#f2a877;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1615; --surface:#18221f; --ink:#eef4f2; --muted:#a4b3af; --line:#2d3b38;
  --accent:#74cbc1; --on-accent:#06201d;
  --danger:#ffb4a9; --danger-bg:#4a1410;
  --warn:#ffd27a; --warn-bg:#3d2c00;
  --ok:#8fdcae; --ok-bg:#12331f;
  --lane-advice:#7fd3a0; --lane-local:#8fbdf2; --lane-alert:#f2a877;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.55;display:flex;justify-content:center}
.app{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;background:var(--bg)}
header{display:flex;align-items:center;gap:8px;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--line)}
.mark{background:var(--accent);color:var(--on-accent);font-weight:700;border-radius:10px;padding:6px 9px;font-size:16px;letter-spacing:.02em}
header h1{font-size:18px;margin:0;letter-spacing:-.025em;flex:1;min-width:0;overflow-wrap:anywhere}
#demo-tag{flex:none}
header .spacer,header select{min-width:0}
header{flex-wrap:nowrap}
header select{flex:0 1 auto}
select,input,textarea,button{font:inherit;color:inherit}
select,input,textarea{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-height:56px;width:100%}
header select{width:auto;max-width:108px;min-height:44px;padding:8px;font-size:14px;font-weight:600}
textarea{min-height:96px;resize:vertical}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{flex:1;min-height:0;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;gap:20px}
h2{font-size:28px;font-weight:650;letter-spacing:-.035em;line-height:1.2;margin:0;text-wrap:balance}
h3{font-size:20px;margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted);font-size:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px}
.big{display:flex;align-items:center;gap:16px;width:100%;min-height:80px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;font-size:21px;font-weight:600;letter-spacing:-.02em;text-align:left;cursor:pointer}
.big svg{flex:none;width:36px;height:36px;color:var(--accent)}
.big .chev{margin-left:auto;width:24px;height:24px;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:12px 16px;border-radius:14px;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:650;cursor:pointer;text-decoration:none;text-align:center}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.plain{border-color:var(--line);background:var(--surface);color:var(--ink);justify-content:flex-start;text-align:left;font-weight:600}
.call{background:var(--danger);border-color:var(--danger);color:var(--surface);font-size:20px}
.banner{background:var(--danger-bg);border:2px solid var(--danger);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.banner strong{color:var(--danger);font-size:16px;text-transform:uppercase;letter-spacing:.04em}
.banner .msg{font-size:22px;font-weight:650;line-height:1.3}
.banner.warn{background:var(--warn-bg);border-color:var(--warn)}
.banner.warn strong{color:var(--warn)}
.place{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-top:1px solid var(--line)}
.place:first-of-type{border-top:0;padding-top:0}
.place .row{gap:8px}
.place .btn{min-height:48px;padding:8px 14px;font-size:16px}
.err{color:var(--danger);font-size:15px;font-weight:600}
.seg.wrap{flex-wrap:wrap}
.seg.wrap button{font-size:17px;min-height:48px}
.calm{background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-weight:400;font-size:14px;line-height:1.55}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
ol.steps li{counter-increment:s;display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;font-size:20px;line-height:1.35}
ol.steps li::before{content:counter(s);flex:none;width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:700;display:flex;align-items:center;justify-content:center}
.check{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-of-type{border-top:0}
.check input{flex:none;width:30px;height:30px;min-height:0;padding:0;margin:0;accent-color:var(--accent)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button,.seg button{min-width:56px;min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:24px;font-weight:700;cursor:pointer}
.stepper output{min-width:40px;text-align:center;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:8px}
.seg button{font-size:20px;padding:0 18px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.result{font-size:26px;font-weight:700;line-height:1.2}
.num{display:flex;align-items:center;gap:16px;padding:12px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.num:first-of-type{border-top:0}
.num b{font-size:30px;min-width:76px;color:var(--danger);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.05em;border-radius:8px;padding:3px 8px;background:var(--warn-bg);color:var(--warn)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.no{background:var(--danger-bg);color:var(--danger)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:12px 16px;font-size:16px}
.rec{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.rec:first-of-type{border-top:0}
.lane{border-left:6px solid var(--line);border-radius:0;padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:2px}
.lane.advice{border-color:var(--lane-advice)} .lane.local{border-color:var(--lane-local)} .lane.alert{border-color:var(--lane-alert)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;overflow-wrap:anywhere;display:block}
nav{display:flex;flex-shrink:0;gap:2px;padding:6px 6px max(6px,env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
nav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:500;overflow-wrap:anywhere;text-align:center;border-radius:12px;border-top:3px solid transparent}
nav a svg{width:26px;height:26px}
nav a[aria-current="page"]{color:var(--accent);font-weight:700;background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-top-color:var(--accent)}
@media (hover:hover){.big:hover,.btn.plain:hover{border-color:var(--accent)}nav a:hover{color:var(--accent)}}
@media (max-width:380px){header{flex-wrap:wrap}header select{max-width:94px}header h1{font-size:17px}main{padding:20px 16px}.card{padding:16px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:360px){body{font-size:17px}.big{font-size:20px}nav a{font-size:11px}}
</style>
</head>
<body>
<div class="app">

    <span class="mark" aria-hidden="true">72h</span>

</div>

function providerOptions(service, town, selected) {
  var sug = TOWNS[town][service];
  var ids = Object.keys(PROVIDERS).filter(function (k) { return PROVIDERS[k].service === service; });
  ids.sort(function (a, b) { return (b === sug) - (a === sug); });
  return '<option value=""' + (!selected ? " selected" : "") + ">" + t("none") + "</option>" + ids.map(function (k) {
    return '<option value="' + k + '"' + (k === selected ? " selected" : "") + ">" + esc(PROVIDERS[k].name) + (k === sug ? " (" + t("suggested") + ")" : "") + "</option>";
  }).join("");
}

    localRecords().map(function (r) {

  if (log.length) {

        "<code>" + esc(m.raw) + '</code><span class="muted">' + t("bytes", { n: m.bytes }) + " · " + t(m.ok ? (m.service ? "r_utility_ok" : "r_ok") : m.reason) + "</span></div>";
    }).join('<hr style="width:100%;border:0;border-top:1px solid var(--line);margin:0">') +

var VIEWS = { most: viewMost, felkeszules: viewFelkeszules, helyben: viewHelyben, tervem: viewTervem, frissitesek: viewFrissitesek };

function render(keepScroll) {
  var scr = current(), main = document.getElementById("main"), y = main.scrollTop;

  document.getElementById("title").textContent = t("title");

  main.innerHTML = VIEWS[scr]();
  main.scrollTop = keepScroll ? y : 0;
  document.getElementById("nav").innerHTML = SCREENS.map(function (s) {
    return '<a href="#' + s + '"' + (s === scr ? ' aria-current="page"' : "") + ">" + icon(s) + "<span>" + t("nav_" + s) + "</span></a>";
  }).join("");
}

/* ---------- Compact message: version|template|region|expiry|issuer ---------- */
function receive(issuer, region) {
  var until = Date.now() + 48 * 3600 * 1000;
  var raw = ["1", "T01", region, Math.floor(until / 60000).toString(36), issuer].join("|");
  var reason = checkScope(issuer, "alert", region);
  var bytes = raw.length;
  try { bytes = new TextEncoder().encode(raw).length; } catch (e) {}
  state.msgs = state.msgs.filter(function (m) { return !(m.tpl === "T01" && m.region === region && m.issuer === issuer); });
  state.msgs.push({ at: Date.now(), raw: raw, bytes: bytes, tpl: "T01", region: region, until: until, issuer: issuer, ok: !reason, reason: reason });
  if (state.msgs.length > 8) state.msgs = state.msgs.slice(-8);
  store.set("msgs", state.msgs);
}

/* Compact provider notice: K1|service|kind|cause|town|start|end|issuer  (+ 64-byte signature in production) */
function receiveUtility(issuer, service, kind, cause, town, hours) {
  var start = Date.now(), end = start + hours * 3600 * 1000;
  var raw = ["K1", service === "power" ? "E" : "V", kind === "fault" ? "Z" : "T", cause, town, Math.floor(start / 60000).toString(36), Math.floor(end / 60000).toString(36), issuer].join("|");
  var iss = ISSUERS[issuer], reason = null;
  if (!iss || iss.types.indexOf("utility") === -1) reason = "r_unknown";
  else if (iss.service !== service) reason = "r_service";
  else if (iss.regions.indexOf(TOWNS[town].region) === -1) reason = "r_scope";
  var bytes = raw.length;
  try { bytes = new TextEncoder().encode(raw).length; } catch (e) {}
  state.notices = state.notices.filter(function (n) { return !(n.issuer === issuer && n.town === town && n.service === service); });
  state.notices.push({ at: Date.now(), raw: raw, bytes: bytes, issuer: issuer, service: service, kind: kind, cause: cause, town: town, start: start, end: end, ok: !reason, reason: reason });
  if (state.notices.length > 12) state.notices = state.notices.slice(-12);
  store.set("notices", state.notices);
}

/* ---------- Events ---------- */
document.addEventListener("click", function (ev) {
  var el = ev.target.closest("[data-act]"); if (!el || el.tagName === "INPUT") return;
  var act = el.getAttribute("data-act");
  if (act === "card") { state.card = el.getAttribute("data-id"); render(); }
  else if (act === "back") { state.card = null; render(); }
  else if (act === "persons") { state.persons = Math.min(12, Math.max(1, state.persons + Number(el.getAttribute("data-d")))); store.set("persons", state.persons); render(true); }
  else if (act === "days") { state.days = Number(el.getAttribute("data-d")); store.set("days", state.days); render(true); }
  else if (act === "demo") {
    var n = el.getAttribute("data-n");
    var hp = herePlace();
    if (n === "1") receive("ugy", curRegion());
    else if (n === "2") receive("aghb", curRegion() === "HU-BU" ? "HU-GS" : "HU-BU");
    else if (n === "3") receive("x9k2", curRegion());
    else if (n === "4") receiveUtility(hp.power, "power", "fault", "c4", hp.town, 3);
    else if (n === "5") receiveUtility(hp.water, "water", "planned", "c2", hp.town, 6);
    else if (n === "6") receiveUtility("titasz", "power", "fault", "c1", "budapest", 2);
    else {
      var causes = { power: ["c4", "c2"], water: ["c3", "c2"] };
      state.places.forEach(function (pl, i) {
        if (pl.power) receiveUtility(pl.power, "power", i % 2 ? "planned" : "fault", causes.power[i % 2], pl.town, 3 + i);
        if (pl.water) receiveUtility(pl.water, "water", i % 2 ? "fault" : "planned", causes.water[i % 2 ? 0 : 1], pl.town, 5 + i);
      });
      el.insertAdjacentHTML("afterend", '<p class="muted">' + t("demoFeedNote") + "</p>");
    }
    render(true);
  }
  else if (act === "clear") { state.msgs = []; state.notices = []; store.set("msgs", []); store.set("notices", []); render(true); }
  else if (act === "here") { state.here = el.getAttribute("data-id"); savePlaces(); render(true); }
  else if (act === "place-new") { state.editing = "new"; state.draftErr = null; state.draft = { name: "", town: "budapest", power: TOWNS.budapest.power, water: TOWNS.budapest.water }; render(); }
  else if (act === "place-edit") {
    var pe = state.places.filter(function (p) { return p.id === el.getAttribute("data-id"); })[0];
    state.editing = pe.id; state.draftErr = null; state.draft = { name: pe.name || "", town: pe.town, power: pe.power, water: pe.water }; render();
  }
  else if (act === "place-cancel") { state.editing = null; state.draft = null; state.draftErr = null; render(true); }
  else if (act === "place-save") {
    var d = state.draft;
    var nameIsDefault = state.editing !== "new" && !d.name.trim() && state.places.filter(function (p) { return p.id === state.editing; })[0].name === null;
    if (!d.name.trim() && !nameIsDefault) { state.draftErr = "needName"; render(true); var f = document.getElementById("draft-name"); if (f) f.focus(); return; }
    var rec = { name: d.name.trim() || null, town: d.town, power: d.power || null, water: d.water || null };
    if (state.editing === "new") { rec.id = "p" + Date.now().toString(36); state.places.push(rec); }
    else { state.places = state.places.map(function (p) { return p.id === state.editing ? Object.assign({ id: p.id }, rec) : p; }); }
    state.editing = null; state.draft = null; state.draftErr = null; savePlaces(); render();
  }
  else if (act === "place-del") {
    if (state.places.length < 2) return;
    var id = el.getAttribute("data-id");
    state.places = state.places.filter(function (p) { return p.id !== id; });
    if (state.here === id) state.here = state.places[0].id;
    savePlaces(); render(true);
  }
  else if (act === "copy") {
    var text = planText();
    var status = document.getElementById("copy-status");
    var fail = function () { state.copyText = text; render(true); document.getElementById("copy-status").textContent = t("copyFail"); };
    try {
      navigator.clipboard.writeText(text).then(function () { status.textContent = t("copied"); }, fail);
    } catch (e) { fail(); }
  }
});
document.addEventListener("change", function (ev) {
  var el = ev.target;
  if (el.id === "lang") { state.lang = el.value; store.set("lang", state.lang); render(true); }
  else if (el.id === "draft-town") { state.draft.town = el.value; state.draft.power = TOWNS[el.value].power; state.draft.water = TOWNS[el.value].water; render(true); }
  else if (el.id === "draft-power") { state.draft.power = el.value; }
  else if (el.id === "draft-water") { state.draft.water = el.value; }
  else if (el.getAttribute("data-notif")) { state.contact[el.getAttribute("data-notif")] = el.checked; store.set("contact", state.contact); render(true); }
  else if (el.getAttribute("data-contact")) { render(true); }
  else if (el.getAttribute("data-act") === "check") {
    var id = el.getAttribute("data-id");
    if (el.checked) state.checks[id] = 1; else delete state.checks[id];
    store.set("checks", state.checks); render(true);

});

});
